aid: nutrisystem
name: Nutrisystem (Wellina by Nutrisystem)
description: >-
  Nutrisystem is a direct-to-consumer subscription meal delivery service for
  weight loss, founded in 1972 by Harold Katz and headquartered in Fort
  Washington, Pennsylvania. The company pioneered prepackaged weight-loss
  meal subscriptions, transitioned from physical retail to a
  direct-to-consumer Internet and telephone model in 1999, and added mobile
  delivery beginning in 2010. Nutrisystem is now operated under the marketing
  umbrella "Wellina by Nutrisystem" — a multi-brand health and wellness
  marketplace covering Nutrisystem, Jenny Craig, High Protein, Menopause
  Support, Low Carb (GLP-1 friendly), and the Club Advantage à la carte
  membership.
  The legal operating entity is Nutrisystem, LLC, a subsidiary of
  Wellful, Inc. (the parent organization formed after Kainos Capital
  acquired Nutrisystem from Tivity Health in October 2020). Tivity Health
  no longer owns the brand. Wellful's portfolio also includes South Beach
  Diet (acquired by Nutrisystem in December 2015 for $15 million) and the
  Jenny Craig intellectual property (acquired by Wellful in fall 2023 after
  Jenny Craig's Chapter 7 bankruptcy and relaunched as an e-commerce
  meal-delivery brand). LinkedIn classifies the company under Wellness and
  Fitness Services with 501–1,000 employees. Stephen Mikulak was named
  President in 2021.
  Nutrisystem publishes no public developer APIs, OpenAPI specs, SDKs, or
  developer portal. Its only digital surface beyond the e-commerce sites is
  the consumer-facing Nutrisystem mobile app (iOS / Android) for food
  logging, weight tracking, journaling, and meal-plan adjustments — and the
  equivalent Jenny Craig app — neither of which advertise integrations with
  Apple Health, Google Fit, Fitbit, or any third-party platform. The
  github.com/nutrisystem GitHub organization exists but contains a single
  inactive CSS repository last updated in March 2015. The technology
  footprint is a closed consumer subscription stack with no public
  developer touchpoints.
